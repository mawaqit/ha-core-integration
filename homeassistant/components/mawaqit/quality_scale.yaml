  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: >-
      A config entry always maps to exactly one mosque, so no devices can be
      discovered after setup.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: >-
      This integration has no repairable issues.
  stale-devices:
    status: exempt
    comment: >-
      A config entry always maps to exactly one mosque, so its device is
      removed together with the entry.

