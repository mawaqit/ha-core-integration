  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: >-
      This integration is a cloud service and is not discoverable on the
      network.
  discovery:
    status: exempt
    comment: >-
      This integration is a cloud service and is not discoverable on the
      network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
